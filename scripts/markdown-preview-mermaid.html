<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
function renderMermaid() {
    // matches the CSS toggle in markdown-preview-theme-toggle.html, so
    // diagram node colors track the page theme instead of staying stuck dark
    var theme = document.body.classList.contains('theme-light') ? 'default' : 'dark';
    mermaid.initialize({ startOnLoad: false, theme: theme });
    document.querySelectorAll('pre.mermaid').forEach(function (pre) {
        pre.removeAttribute('data-processed');
        pre.textContent = pre.dataset.source;
    });
    mermaid.run({ querySelector: 'pre.mermaid' });
}
document.addEventListener('DOMContentLoaded', function () {
    // pandoc wraps fenced code in <code>, but mermaid only parses raw text
    // in <pre class="mermaid">, choking on the nested tag if left in place.
    document.querySelectorAll('pre.mermaid').forEach(function (pre) {
        pre.dataset.source = pre.textContent;
    });
    renderMermaid();
});
</script>
